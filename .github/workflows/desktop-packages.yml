name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/desktop-packages.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "protocol/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/desktop-packages.yml"

permissions:
  contents: read

jobs:
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = "arm64"
      - run: ./gradlew :protocol:test :desktop:test :desktop:verifyDesktopRuntimeModules :desktop:packageMacApp
      - name: Verify macOS arm64 package contents
        shell: bash
        run: |
          libraries="desktop/build/package/macos/CamHub Desktop.app/Contents/app/lib"
          runtime="desktop/build/package/macos/CamHub Desktop.app/Contents/runtime/bin/java"
          test -s "$libraries/ffmpeg-7.1-1.5.11-macosx-arm64.jar"
          test -s "$libraries/javacpp-1.5.11-macosx-arm64.jar"
          file "$runtime" | grep -q 'arm64'
      - name: Archive and verify signed macOS app
        shell: bash
        run: |
          package="desktop/build/package/CamHub-Desktop-macOS-arm64.zip"
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          ditto -c -k --sequesterRsrc --keepParent "desktop/build/package/macos/CamHub Desktop.app" "$package"
          ditto -x -k "$package" "$verification_dir"
          codesign --verify --deep --strict "$verification_dir/CamHub Desktop.app"
          plutil -lint "$verification_dir/CamHub Desktop.app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: CamHub-Desktop-macOS-arm64
          path: desktop/build/package/CamHub-Desktop-macOS-arm64.zip
          if-no-files-found: error

  windows-exe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Windows installer toolchain
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "The Windows desktop package requires an x64 runner, found $env:PROCESSOR_ARCHITECTURE."
          }
          $jpackage = Join-Path $env:JAVA_HOME "bin/jpackage.exe"
          $jdeps = Join-Path $env:JAVA_HOME "bin/jdeps.exe"
          if (-not (Test-Path $jpackage)) {
            throw "jpackage.exe is missing from JAVA_HOME: $env:JAVA_HOME"
          }
          if (-not (Test-Path $jdeps)) {
            throw "jdeps.exe is missing from JAVA_HOME: $env:JAVA_HOME"
          }
          & $jpackage --version
          & $jdeps --version
          foreach ($tool in @("candle.exe", "light.exe")) {
            $resolved = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $resolved) {
              throw "$tool is required by jpackage --type exe, but is not on PATH."
            }
            Write-Host "$tool => $($resolved.Source)"
          }
      - run: .\gradlew.bat :protocol:test :desktop:test :desktop:verifyDesktopRuntimeModules :desktop:packageWindowsExe
      - name: Verify Windows installer artifact
        shell: pwsh
        run: |
          $libraries = "desktop/build/install/CamHub Desktop/lib"
          foreach ($jar in @("ffmpeg-7.1-1.5.11-windows-x86_64.jar", "javacpp-1.5.11-windows-x86_64.jar")) {
            $path = Join-Path $libraries $jar
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Expected Windows x64 native runtime dependency: $path"
            }
          }
          $installers = @(Get-ChildItem "desktop/build/package/windows" -Filter "*.exe" -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -le 0) {
            throw "Expected one non-empty Windows installer, found $($installers.Count)."
          }
          Write-Host "Installer: $($installers[0].FullName) ($($installers[0].Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: CamHub-Desktop-Windows-x64
          path: desktop/build/package/windows/*.exe
          if-no-files-found: error
