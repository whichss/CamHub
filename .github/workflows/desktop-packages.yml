name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/desktop-packages.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "protocol/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/desktop-packages.yml"

permissions:
  contents: read

jobs:
  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify macOS arm64 runner
        run: test "$(uname -m)" = "arm64"
      - name: Test and package desktop app
        shell: bash
        run: |
          set +e
          ./gradlew :protocol:test :desktop:test :desktop:verifyDesktopRuntimeModules :desktop:packageMacApp --stacktrace 2>&1 | tee "$RUNNER_TEMP/camhub-desktop-build.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            detail="$(python3 -c 'import pathlib,sys; lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines(); marker="FAILURE: Build failed with an exception."; starts=[i for i,line in enumerate(lines) if marker in line]; start=starts[-1] if starts else max(0,len(lines)-120); excerpt="\n".join(lines[start:start+40]); pathlib.Path(sys.argv[2]).write_text(excerpt+"\n"); print(excerpt[:4000].replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/camhub-desktop-build.log" "$RUNNER_TEMP/camhub-desktop-failure.txt")"
            if [ -d desktop/build/test-results/test ]; then
              python3 - "$RUNNER_TEMP/camhub-desktop-test-failures.txt" <<'PY'
          import glob
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          failures = []
          for report_path in glob.glob("desktop/build/test-results/test/TEST-*.xml"):
              for case in ET.parse(report_path).getroot().iter("testcase"):
                  for kind in ("failure", "error"):
                      failure = case.find(kind)
                      if failure is not None:
                          details = (failure.text or "")[:3000]
                          failures.append(
                              f"{case.get('classname')}::{case.get('name')} [{kind}] "
                              f"{failure.get('message', '')}\n{details}"
                          )

          summary = "\n\n".join(failures) if failures else "No JUnit failure entries were found."
          pathlib.Path(sys.argv[1]).write_text(summary + "\n")
          PY
              cat "$RUNNER_TEMP/camhub-desktop-test-failures.txt" >> "$GITHUB_STEP_SUMMARY"
              test_detail="$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).read_text(errors="replace")[:10000].replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/camhub-desktop-test-failures.txt")"
              detail="$test_detail%0A$detail"
            fi
            cat "$RUNNER_TEMP/camhub-desktop-failure.txt" >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Desktop package failure::$detail"
            exit "$result"
          fi
      - name: Verify macOS arm64 package contents
        shell: bash
        run: |
          libraries="desktop/build/package/macos/CamHub Desktop.app/Contents/app/lib"
          runtime="desktop/build/package/macos/CamHub Desktop.app/Contents/runtime/bin/java"
          test -s "$libraries/ffmpeg-7.1-1.5.11-macosx-arm64.jar"
          test -s "$libraries/javacpp-1.5.11-macosx-arm64.jar"
          file "$runtime" | grep -q 'arm64'
      - name: Archive and verify signed macOS app
        shell: bash
        run: |
          package="desktop/build/package/CamHub-Desktop-macOS-arm64.zip"
          verification_dir="$(mktemp -d)"
          trap 'rm -rf "$verification_dir"' EXIT
          ditto -c -k --sequesterRsrc --keepParent "desktop/build/package/macos/CamHub Desktop.app" "$package"
          ditto -x -k "$package" "$verification_dir"
          codesign --verify --deep --strict "$verification_dir/CamHub Desktop.app"
          plutil -lint "$verification_dir/CamHub Desktop.app/Contents/Info.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: CamHub-Desktop-macOS-arm64
          path: desktop/build/package/CamHub-Desktop-macOS-arm64.zip
          if-no-files-found: error

  windows-exe:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify Windows installer toolchain
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
            throw "The Windows desktop package requires an x64 runner, found $env:PROCESSOR_ARCHITECTURE."
          }
          $jpackage = Join-Path $env:JAVA_HOME "bin/jpackage.exe"
          $jdeps = Join-Path $env:JAVA_HOME "bin/jdeps.exe"
          if (-not (Test-Path $jpackage)) {
            throw "jpackage.exe is missing from JAVA_HOME: $env:JAVA_HOME"
          }
          if (-not (Test-Path $jdeps)) {
            throw "jdeps.exe is missing from JAVA_HOME: $env:JAVA_HOME"
          }
          & $jpackage --version
          & $jdeps --version
          foreach ($tool in @("candle.exe", "light.exe")) {
            $resolved = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $resolved) {
              throw "$tool is required by jpackage --type exe, but is not on PATH."
            }
            Write-Host "$tool => $($resolved.Source)"
          }
      - name: Test and package Windows installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "camhub-windows-build.log"
          & .\gradlew.bat :protocol:test :desktop:test :desktop:verifyDesktopRuntimeModules :desktop:packageWindowsExe --stacktrace 2>&1 | Tee-Object -FilePath $log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $lines = Get-Content $log
            $failureIndex = -1
            for ($index = 0; $index -lt $lines.Count; $index++) {
              if ($lines[$index] -like '*FAILURE: Build failed with an exception.*') {
                $failureIndex = $index
              }
            }
            if ($failureIndex -lt 0) { $failureIndex = [Math]::Max(0, $lines.Count - 120) }
            $endIndex = [Math]::Min($lines.Count - 1, $failureIndex + 119)
            $excerpt = ($lines[$failureIndex..$endIndex] -join "`n")
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $excerpt
            $testFailures = [System.Collections.Generic.List[string]]::new()
            $testReports = Get-ChildItem "desktop/build/test-results/test" -Filter "TEST-*.xml" -File -ErrorAction SilentlyContinue
            foreach ($testReport in $testReports) {
              [xml]$report = Get-Content $testReport.FullName -Raw
              foreach ($testCase in $report.SelectNodes("//testcase[failure or error]")) {
                foreach ($failure in $testCase.SelectNodes("failure | error")) {
                  $testFailures.Add("$($testCase.classname)::$($testCase.name) [$($failure.LocalName)] $($failure.message)`n$($failure.InnerText)")
                }
              }
            }
            $testDetail = if ($testFailures.Count -gt 0) { $testFailures -join "`n`n" } else { "No JUnit failure entries were found." }
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $testDetail
            $fullDetail = "$testDetail`n$excerpt"
            $detail = $fullDetail.Substring(0, [Math]::Min(12000, $fullDetail.Length)).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows package failure::$detail"
            exit $result
          }
      - name: Verify Windows installer artifact
        shell: pwsh
        run: |
          $libraries = "desktop/build/install/CamHub Desktop/lib"
          foreach ($jar in @("ffmpeg-7.1-1.5.11-windows-x86_64.jar", "javacpp-1.5.11-windows-x86_64.jar")) {
            $path = Join-Path $libraries $jar
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Expected Windows x64 native runtime dependency: $path"
            }
          }
          $installers = @(Get-ChildItem "desktop/build/package/windows" -Filter "*.exe" -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -le 0) {
            throw "Expected one non-empty Windows installer, found $($installers.Count)."
          }
          Write-Host "Installer: $($installers[0].FullName) ($($installers[0].Length) bytes)"
      - uses: actions/upload-artifact@v4
        with:
          name: CamHub-Desktop-Windows-x64
          path: desktop/build/package/windows/*.exe
          if-no-files-found: error
