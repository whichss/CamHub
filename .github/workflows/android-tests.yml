name: Android tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "desktop/**"
      - "ios/**"
      - "protocol/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "desktop/**"
      - "ios/**"
      - "protocol/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-tests.yml"

permissions:
  contents: read

jobs:
  android-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36

      - uses: gradle/actions/setup-gradle@v6

      - name: Run Android and shared protocol unit tests
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :protocol:test
          --no-daemon
